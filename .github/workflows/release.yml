name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build and release"
        required: true
        type: string
      tag:
        description: "Tag name for the release"
        required: true
        type: string
      pkg_version:
        description: "Explicit package version without a leading v"
        required: false
        type: string
      pre-release:
        description: "Create as published pre-release instead of draft release"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      pkg_version: ${{ inputs.pkg_version }}

  delete_prerelease:
    name: Delete pre-release
    needs: build
    if: ${{ inputs.pre-release }}
    uses: ./.github/workflows/delete-prerelease.yml

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, delete_prerelease]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
      (needs.delete_prerelease.result == 'success' ||
      needs.delete_prerelease.result == 'skipped') }}
    steps:
    - name: Clone tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/gen-changelog.py --ref ${{ inputs.ref }} -o CHANGELOG.md
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: xemu-msvc-profile.zip
        path: dist
    - name: Normalize MSVC asset names
      env:
        PKG_VERSION: ${{ needs.build.outputs.pkg_version }}
      run: |
        set -euo pipefail
        mv dist/xemu-msvc-profile.zip "dist/xemu-${PKG_VERSION}-msvc-profile.zip"

    - name: Create release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ${{ inputs.pre-release && 'Latest Development Build' || inputs.tag }}
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ inputs.ref }}
        body_path: CHANGELOG.md
        draft: ${{ !inputs.pre-release }}
        prerelease: ${{ inputs.pre-release }}
        make_latest: false
        files: |
          dist/xemu*-msvc-profile.zip
        fail_on_unmatched_files: true

    - name: Keep stable release below development build
      if: ${{ inputs.pre-release }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        stable_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
          --jq '.[] | select(.draft == false and .prerelease == false) | .id' | head -n 1)"
        if [ -n "$stable_id" ]; then
          printf '{"make_latest":"false"}' |
          gh api --method PATCH "repos/$GH_REPO/releases/$stable_id" \
            --input - >/dev/null
        fi
